name: CodeQL

# Advanced-setup code scanning. GitHub's "default setup" is deliberately left
# not-configured: the two cannot run side by side, and this file keeps the
# query suite and triggers under review like any other change.
#
# The `codeql` job is a required status check on main, and a repository ruleset
# blocks merging a pull request that introduces a CodeQL alert of severity
# error or security severity high/critical.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 07:23 UTC: catches new queries against unchanged code.
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # JavaScript/TypeScript is analysed from source, so nothing is built.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
