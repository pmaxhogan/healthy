name: Release

# Publishes the Android companion app (android/) as a GitHub release, which is
# where Obtainium picks it up. Every push to main cuts one, including a push
# that only touched the Worker: the version's patch number is the repository's
# commit count, so there is deliberately no path filter.
on:
  push:
    branches: [main]
  # Merges performed with the workflow token (Dependabot auto-merge) do not
  # trigger push workflows, so a daily pass releases any HEAD not yet tagged.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Read-only by default; only the job that publishes gets to write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is HEAD already released?
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.probe.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: probe
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD 'v*' | tr '\n' ' ')"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build signed APK and publish release
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # Creating the release and its tag is the one thing here that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The build compiles against an SDK platform the runner image may not
      # ship. The Android Gradle plugin downloads a missing platform itself, but
      # only once its licence is accepted, so accept them up front rather than
      # fail at the first Gradle task.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Compute version
        id: version
        run: |
          base="$(tr -d '[:space:]' < android/VERSION)"
          patch="$(git rev-list --count HEAD)"
          {
            echo "name=${base}.${patch}"
            echo "patch=${patch}"
            echo "tag=v${base}.${patch}"
          } >> "$GITHUB_OUTPUT"

      # The release does not wait for the CI workflow, so it gates itself: an
      # APK is never signed and published from a tree whose tests or lint fail.
      - name: Gate on tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Decode keystore
        # Through the environment, never interpolated into the script text.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # An unset secret decodes to an empty file; say so here rather than
          # let Gradle fail later with a keystore error that names no cause.
          test -s "$RUNNER_TEMP/release.jks" || { echo "KEYSTORE_BASE64 is not set"; exit 1; }

      - name: Build signed release APK
        working-directory: android
        env:
          HEALTHY_PATCH: ${{ steps.version.outputs.patch }}
          HEALTHY_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HEALTHY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEALTHY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HEALTHY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/healthy-companion-${{ steps.version.outputs.name }}.apk"

      - name: Verify signature
        run: |
          tool="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$tool" verify --print-certs "healthy-companion-${{ steps.version.outputs.name }}.apk"

      - name: Release notes
        id: notes
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          {
            echo "## Healthy Companion ${{ steps.version.outputs.name }}"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s (%h)' "$prev"..HEAD
            else
              echo "First release."
            fi
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "healthy-companion-${{ steps.version.outputs.name }}.apk" \
            --title "Healthy Companion ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
