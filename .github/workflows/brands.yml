name: Refresh Epic brands index

on:
  schedule:
    # Mondays 09:17 UTC
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Refresh data/epic-brands.json
        run: node scripts/slim-brands.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/epic-brands.json; then
            echo "No changes to data/epic-brands.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epic-brands.json
          git commit -m "chore(data): refresh Epic brands index"
          git push origin HEAD:main
