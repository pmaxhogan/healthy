name: Refresh Epic brands index

on:
  schedule:
    # Mondays 09:17 UTC
    - cron: "17 9 * * 1"
  workflow_dispatch: {}
  # main requires PRs to be up to date before merging, and nothing rebases the
  # refresh PR when another PR lands first (Dependabot only rebases its own),
  # so it would sit "behind" until next week. A push to main re-runs this job
  # -- only while a refresh PR is open -- to rebuild the PR on the new main.
  push:
    branches: [main]

concurrency:
  group: brands-refresh
  cancel-in-progress: false

# main requires 4 status checks (check, gitleaks, codeql, dependency-review)
# plus a CodeQL code scanning result for the commit, so a push authenticated
# with GITHUB_TOKEN straight to main is rejected (GH013) -- none of that ever
# runs for such a commit (this is why run 36459691246 failed). This job pushes
# to a fixed branch instead, opens (or refreshes) a PR for it, and enables
# auto-merge so it completes on its own once the required checks report.
#
# Opening the PR with GITHUB_TOKEN does queue the pull_request-triggered check
# runs, but GitHub holds them as "action_required" pending a maintainer's
# approval, because the PR's author (github-actions[bot]) has no
# write-collaborator association on the repo. Having a bot commit merged does
# not lift that (tested: PR #14 was held after #11 merged). A
# workflow_dispatch run against the branch tip does not help either -- those
# check suites are never associated with the PR, so its merge gate keeps
# waiting. So the last step approves the held runs for the commit this job
# pushed (POST .../actions/runs/{id}/approve, hence actions: write). That only
# lets the same checks a human PR gets run; auto-merge still waits for every
# required check to pass.
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run unless this is a push with no refresh PR open
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] ||
            [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/brands-refresh --base main --state open --json number --jq '.[0].number // empty')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: chore/brands-refresh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Refresh worker/data/epic-brands.json
        run: node worker/scripts/slim-brands.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet worker/data/epic-brands.json; then
            echo "No changes to worker/data/epic-brands.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main already matches upstream, so an open refresh PR has nothing left
      # to merge; left alone it would sit "behind" forever.
      - name: Close a refresh PR that is no longer needed
        if: steps.diff.outputs.changed == 'false'
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr close "$existing" --delete-branch --comment "main already matches the Epic brands index."
          fi

      - name: Push refresh branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/data/epic-brands.json
          git commit -m "chore(data): refresh Epic brands index"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh Epic brands index" \
              --body "Automated weekly refresh of \`worker/data/epic-brands.json\` from the Epic brands index (\`worker/scripts/slim-brands.mjs\`). Merges automatically once the required checks pass."
          else
            gh pr edit "$existing" \
              --body "Automated weekly refresh of \`worker/data/epic-brands.json\` from the Epic brands index (\`worker/scripts/slim-brands.mjs\`). Merges automatically once the required checks pass. Last pushed: $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi
          echo "number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        run: |
          already=$(gh pr view "${{ steps.pr.outputs.number }}" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')
          if [ -z "$already" ]; then
            gh pr merge "${{ steps.pr.outputs.number }}" --auto --squash
          fi

      # Runs appear a few seconds after the push, and not all at once, so poll
      # for a while and approve whatever is held each time round.
      - name: Approve the held pull_request check runs
        if: steps.diff.outputs.changed == 'true'
        run: |
          sha=$(git rev-parse HEAD)
          approved=0
          for _ in $(seq 1 18); do
            sleep 10
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
              approved=$((approved + 1))
            done
          done
          if [ "$approved" -eq 0 ]; then
            echo "::warning::No held runs found for $sha"
          fi
