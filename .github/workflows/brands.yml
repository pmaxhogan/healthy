name: Refresh Epic brands index

on:
  schedule:
    # Mondays 09:17 UTC
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

# main requires 4 status checks (check, gitleaks, codeql, dependency-review)
# plus a CodeQL code scanning result for the commit, so a push authenticated
# with GITHUB_TOKEN straight to main is rejected (GH013) -- none of that ever
# runs for such a commit (this is why run 36459691246 failed). This job pushes
# to a fixed branch instead, opens (or refreshes) a PR for it, and enables
# auto-merge so it completes on its own once the required checks report.
#
# One gap remains, confirmed by testing this workflow for real (see PR #11):
# opening the PR *does* queue the pull_request-triggered check runs (contrary
# to the general claim that GITHUB_TOKEN-authored events never cascade to
# other workflows), but GitHub holds them as "action_required" pending a
# maintainer's approval, because the PR's author (github-actions[bot], via
# GITHUB_TOKEN) has no recognised write-collaborator association on the repo.
# A workflow_dispatch run against the branch tip can make check-runs of the
# right names succeed on that SHA, but those check suites are never
# associated with the PR (only a push/pull_request-triggered suite gets that
# association), so the PR's merge gate still shows all 4 as "Expected --
# Waiting for status to be reported" regardless. That approach was tried and
# reverted here; see the PR's own history for the extra commits.
#
# Closing this the rest of the way needs one of:
#   - the owner manually approving the held workflow runs each week (one
#     click, in the PR's "Merge info" box or the Actions tab), or
#   - authenticating the push/PR-open with something other than GITHUB_TOKEN
#     (a fine-grained PAT, repo-scoped, contents:write + pull-requests:write;
#     or a GitHub App installation token) stored as a secret, so the actor
#     opening the PR is a real write-collaborator and pull_request workflows
#     run the same way they do for a human or Dependabot PR today.
# Either is the owner's call -- this workflow does not create secrets or
# change repository rules on its own.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: chore/brands-refresh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Refresh data/epic-brands.json
        run: node scripts/slim-brands.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/epic-brands.json; then
            echo "No changes to data/epic-brands.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refresh branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epic-brands.json
          git commit -m "chore(data): refresh Epic brands index"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh Epic brands index" \
              --body "Automated weekly refresh of \`data/epic-brands.json\` from the Epic brands index (\`scripts/slim-brands.mjs\`). Merges automatically once the required checks pass."
          else
            gh pr edit "$existing" \
              --body "Automated weekly refresh of \`data/epic-brands.json\` from the Epic brands index (\`scripts/slim-brands.mjs\`). Merges automatically once the required checks pass. Last pushed: $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi
          echo "number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        run: |
          already=$(gh pr view "${{ steps.pr.outputs.number }}" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')
          if [ -z "$already" ]; then
            gh pr merge "${{ steps.pr.outputs.number }}" --auto --squash
          fi
