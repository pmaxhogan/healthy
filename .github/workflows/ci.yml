name: CI

# Deploys are run by Cloudflare Workers Builds, not by Actions, so there is no
# deploy job here. Workers Builds runs `npm run check` as its build command,
# which means this workflow and the deploy gate are literally the same command.
on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be replayed from the Actions tab without an empty commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` fails loudly when package.json and the lockfile disagree,
      # which is the point: it is also what Workers Builds runs, so a lockfile
      # that installs here installs there.
      - run: npm ci

      # lint -> typecheck -> knip -> test -> build, in that order.
      - run: npm run check

  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits through the API, which
    # needs an explicit pull-requests read grant: on Dependabot-opened PRs the
    # token is otherwise restricted and the action fails with 403 before it
    # scans anything.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the tip, so it needs all of it.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Android companion app (android/). Separate from `check` on purpose:
  # `npm run check` does not run Gradle, and Workers Builds must not need a JDK.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          # The app's patch version is the commit count, so it needs all of history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The build compiles against an SDK platform the runner image may not
      # ship. The Android Gradle plugin downloads a missing platform itself, but
      # only once its licence is accepted, so accept them up front rather than
      # fail at the first Gradle task.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: healthy-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
